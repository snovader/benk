version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/.github/actions/*"
      - "/.github/workflows"
    schedule:
      interval: "daily"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      # oxlint requires a version of oxlint-tsgolint, and oxfmt is released
      # with it
      # @snovader/oxc-config names oxfmt's and oxlint's versions as peers
      "oxc":
        patterns:
          - "oxfmt"
          - "oxlint"
          - "oxlint-tsgolint"
          - "@snovader/*"
